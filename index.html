<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MirsultonAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
}

.container{
    width:90%;
    margin:20px auto;
    text-align:center;
}

.box{
    background:rgba(255,255,255,.15);
    padding:25px;
    border-radius:25px;
    backdrop-filter:blur(15px);
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:25px;
}

.card{
    width:220px;
    padding:20px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
}

.icon{
    font-size:40px;
}
</style>

</head>


<body>

<div class="container">

<div class="box">
<h1>♾️ MirsultonAI</h1>
<p>AI, Football, Games and News</p>
</div>


<div class="cards">

<div class="card">
<div class="icon">🤖</div>
<h2>AI</h2>
<p>Smart Assistant</p>
</div>


<div class="card">
<div class="icon">⚽</div>
<h2>Football</h2>
<p>Matches</p>
</div>


<div class="card">
<div class="icon">🎮</div>
<h2>Game</h2>
<p>Gaming Zone</p>
</div>


<div class="card">
<div class="icon">📰</div>
<h2>News</h2>
<p>Latest News</p>
</div>

</div>

</div>


</body>
</html>
