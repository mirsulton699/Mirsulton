<section class="hero">



<div class="glass-box">


<h1>
♾️ Infinity AI
</h1>


<p>
Your personal smart assistant
</p>


</div>






<div class="chat-box">



<div class="ai-message">

🤖 Infinity AI:
<br>
Salom! Men sizning aqlli yordamchingizman.
Savolingizni yozing.

</div>



<div id="messages"></div>




<div class="input-area">


<input 
id="input"
placeholder="Savolingizni yozing..."
>


<button onclick="send()">
➤
</button>


</div>



</div>



</section>






<script src="script.js"></script>


<script>


function send(){


let input=document.getElementById("input");

let messages=document.getElementById("messages");


if(input.value.trim()=="") return;



messages.innerHTML += `

<div class="user-message">

👤 ${input.value}

</div>

`;



setTimeout(()=>{


messages.innerHTML += `

<div class="ai-message">

🤖 Infinity AI:
<br>
Savolingiz qabul qilindi. 
Haqiqiy AI API ulanmoqda...

</div>

`;


},700);



input.value="";


}



document.getElementById("input")
.addEventListener("keydown",function(e){


if(e.key==="Enter"){

send();

}


});


</script>
